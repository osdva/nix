# Noctalia v5 config.
# Linked into ~/.config/noctalia/config.toml by home-manager (read-only).
# Changes made in the Settings UI are saved as overrides in the state dir;
# `noctalia config export merged` prints them so they can be copied back here.

[shell]
font_family = "Adwaita Sans"
avatar_path = "/home/osdva/Pictures/avatar.jpg"
time_format = "{:%I:%M %p}"
date_format = "%a, %b %d"
telemetry_enabled = false
setup_wizard_enabled = false
polkit_agent = true
clipboard_enabled = true

    [shell.launcher]
    categories = true
    sort_by_usage = true

    [shell.shadow]
    direction = "down_right"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"
builtin = "Kanagawa"

[bar]
order = ["default"]

    [bar.default]
    position = "top"
    background_opacity = 0.93
    capsule = true
    widget_spacing = 6
    show_on_workspace_switch = true
    start = ["workspaces", "active_window", "media"]
    center = ["date", "thepunkoff/pomodoro:widget"]
    end = [
        "tray",
        "notifications",
        "keyboard_layout",
        "cpu",
        "ram",
        "battery",
        "volume",
        "caffeine",
        "control-center",
    ]

[widget.date]
type = "clock"
format = "{:%I:%M %p  %a, %b %d}"

[widget.keyboard_layout]
type = "keyboard_layout"
hide_when_single_layout = true

[battery]
warning_threshold = 20

[audio]
enable_volume_sounds = false
enable_notification_sounds = false

[idle]
behavior_order = ["screen-off", "lock", "hibernate"]

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 660.0

    [idle.behavior.hibernate]
    action = "command"
    command = "systemctl hibernate"
    enabled = true
    timeout = 1800.0

[lockscreen]
enabled = true
fingerprint = true
lock_before_suspend = true

[location]
auto_locate = false
address = "Curitiba"

[weather]
enabled = true
effects = false
unit = "metric"

[nightlight]
enabled = false
temperature_day = 6500
temperature_night = 4000

[notification]
position = "top_right"

[osd]
position = "top_right"
hide_delay_ms = 2000

[wallpaper]
enabled = true
directory = "/home/osdva/Pictures/wallpapers"
fill_mode = "crop"
transition = ["disc", "wipe", "fade"]
transition_duration = 1500.0
transition_on_startup = false

[desktop_widgets]
enabled = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[shell.session]
show_shortcuts = true

    [[shell.session.actions]]
    action = "lock"
    shortcut = "1"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    shortcut = "2"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    label = "Hibernate"
    glyph = "hibernate"
    shortcut = "3"

    [[shell.session.actions]]
    action = "reboot"
    shortcut = "4"

    [[shell.session.actions]]
    action = "logout"
    shortcut = "5"

    [[shell.session.actions]]
    action = "shutdown"
    shortcut = "6"
    variant = "destructive"

[plugins]
enabled = ["thepunkoff/pomodoro"]
